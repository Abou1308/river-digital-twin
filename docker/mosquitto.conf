# Mosquitto broker for the twin (docker compose, and tests against a local broker).
listener 1883
allow_anonymous true

# A replay at full speed publishes faster than the twin processes. Mosquitto drops QoS 1 messages once
# a subscriber has more than max_queued_messages waiting (default 1000), which would silently lose
# readings, so the queue is unlimited. The replay waits for acknowledgements, which bounds it in practice.
max_queued_messages 0
